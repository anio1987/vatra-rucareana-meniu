<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vatra Rucareana - Meniu</title><style>:root{--v:#790f22;--bg:#fff7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#3c2822;font:16px Arial,sans-serif}header{text-align:center;background:var(--v);color:#fff;padding:27px 12px}h1{font:34px Georgia;margin:0}header p{margin:8px 0 0}.notice{text-align:center;background:#f3e2c3;padding:14px}main{max-width:780px;margin:auto;padding:16px 14px 105px}h2{font:25px Georgia;color:var(--v);margin:29px 0 13px}.item{background:white;border:1px solid #e6d4bf;border-radius:12px;margin:9px 0;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.item small{display:block;color:#777;margin-top:6px}.controls{text-align:right;white-space:nowrap}.controls strong{display:block;margin-bottom:9px}button{border:0;background:var(--v);color:#fff;border-radius:9px;padding:9px 13px;font-weight:bold;cursor:pointer}.footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:2px solid #c99b54;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.footer button,.send{background:#17804a;padding:14px}.shade{display:none;position:fixed;inset:0;background:#0009;align-items:end;justify-content:center}.shade.open{display:flex}.panel{background:var(--bg);border-radius:18px 18px 0 0;padding:20px;max-width:620px;width:100%;max-height:92vh;overflow:auto}.panel input,.panel select,.panel textarea{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbb9a7;border-radius:8px;font:inherit}.send{width:100%}.fine{font-size:13px;color:#6e6157}</style></head><body><header><h1>VATRA RUCAREANA</h1><p>Gust de-acasa · Meniu si comenzi</p></header><div class="notice">Livrare doar in Rucar · Transport gratuit pentru comenzi de peste 100 lei</div><main id="menu"></main><div class="footer"><div><strong id="total">0 lei</strong><div id="count">0 produse</div></div><button onclick="openCart()">Vezi cosul si comanda</button></div><div class="shade" id="shade"><section class="panel"><button style="float:right" onclick="document.getElementById('shade').classList.remove('open')">Inchide</button><h2>Comanda ta</h2><div id="cart"></div><p id="delivery"></p><label>Nume *</label><input id="name" placeholder="Nume si prenume"><label>Telefon *</label><input id="phone" type="tel" placeholder="07..."><label>Modalitate</label><select id="method" onchange="document.getElementById('addressWrap').hidden=this.value!=='Livrare'"><option>Ridicare din magazin</option><option>Livrare</option></select><div id="addressWrap" hidden><label>Adresa din Rucar *</label><textarea id="address"></textarea></div><label>Observatii</label><textarea id="notes" placeholder="Ziua sau ora preferata"></textarea><p class="fine">Pentru comenzi de maximum 100 lei, taxa de livrare se confirma de magazin. Trimiterea se finalizeaza in WhatsApp.</p><button class="send" onclick="send()">Trimite comanda pe WhatsApp</button></section></div><script>
const groups=[['Specialitati de sarbatori',[['Cozonac',85,'buc.'],['Placinta cu mere la tava',85,'tava'],['Prajitura la tava (asortata)',120,'kg']]],['Paine si brutarie',[['Paine alba rotunda',7],['Paine alba la tava',6],['Paine integrala',8],['Franzela',6],['Chifle',1.5],['Bagheta',6]]],['Specialitati de brutarie',[['Covrigi mac/susan',2],['Corn cu gem',3],['Corn cu ciocolata',4],['Rulouri cu telemea',4]]],['Prajituri si deserturi',[['Eclere',11],['Amandina',14],['Savarina',11],['Rasfat Rucarean',12],['Bile dulci',1.5],['Placinta cu mere',6],['Placinta fara zahar',6],['Desert la doza mare',14],['Desert la doza mica',12],['Fresh doza mare',14],['Fresh doza mica',6],['Popcorn mare',8]]]];
const products=groups.flatMap((g,i)=>g[1].map((p,j)=>({id:i+'-'+j,name:p[0],price:p[1],unit:p[2]||'buc.'})));const qty={};const fmt=n=>n.toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2})+' lei';const sum=()=>products.reduce((a,p)=>a+p.price*(qty[p.id]||0),0);
function change(id,d){qty[id]=Math.max(0,(qty[id]||0)+d);render()}function render(){document.getElementById('menu').innerHTML=groups.map((g,i)=>'<h2>'+g[0]+'</h2>'+g[1].map((p,j)=>{const x=products.find(z=>z.id===i+'-'+j);return '<div class="item"><div><b>'+x.name+'</b><small>per '+x.unit+'</small></div><div class="controls"><strong>'+fmt(x.price)+'</strong><button onclick="change(\''+x.id+'\',-1)">−</button> '+(qty[x.id]||0)+' <button onclick="change(\''+x.id+'\',1)">+</button></div></div>'}).join('')).join('');document.getElementById('total').textContent=fmt(sum());document.getElementById('count').textContent=Object.values(qty).reduce((a,b)=>a+b,0)+' produse';cart()}function cart(){document.getElementById('cart').innerHTML=products.filter(p=>qty[p.id]).map(p=>'<p>'+qty[p.id]+' x '+p.name+' = '+fmt(p.price*qty[p.id])+'</p>').join('')||'Cosul este gol.';document.getElementById('delivery').textContent=sum()>100?'Transport gratuit pentru livrare.':'Transport gratuit numai pentru comenzi de peste 100 lei.'}function openCart(){cart();document.getElementById('shade').classList.add('open')}function send(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),method=document.getElementById('method').value,address=document.getElementById('address').value.trim(),notes=document.getElementById('notes').value.trim();if(!sum()||!name||!phone||(method==='Livrare'&&!address)){alert('Adauga produse si completeaza datele obligatorii.');return}const msg=['Buna ziua! Comanda Vatra Rucareana:','',...products.filter(p=>qty[p.id]).map(p=>qty[p.id]+' x '+p.name+' = '+fmt(p.price*qty[p.id])),'','Total produse: '+fmt(sum()),sum()>100?'Transport gratuit':'Taxa de livrare se confirma separat','Nume: '+name,'Telefon: '+phone,'Modalitate: '+method,method==='Livrare'?'Adresa Rucar: '+address:'',notes?'Observatii: '+notes:''].filter(Boolean).join('\n');window.open('https://wa.me/40746378346?text='+encodeURIComponent(msg),'_blank','noopener')}render();
</script></body></html>
